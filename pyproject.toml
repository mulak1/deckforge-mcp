[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deckforge-mcp"
version = "1.0.0"
description = "DeckForge MCP — Native Editable PowerPoint (.pptx), Executive Memo-to-Slide Spec, and Google Slides Batch Generator for Claude Connectors & ChatGPT MCP Store"
readme = "GEMINI.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
